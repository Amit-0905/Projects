{% extends 'base.html' %}

{% block title %}New Post - {{blog_title}}{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(to right, #3498db, #2ecc71);
        font-family: 'Roboto', sans-serif;
        color: #333;
    }

    .new_post {
        padding: 40px;
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        max-width: 800px;
        margin: 50px auto;
        animation: slideIn 1s ease-out;
    }

    .new_post h1, .new_post h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
    }

    .new_post form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        font-size: 1.2rem;
        margin-bottom: 10px;
        color: #16a085;
    }

    input[type="text"], textarea {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 2px solid #16a085;
        margin-bottom: 20px;
        font-size: 1.1rem;
        transition: border-color 0.3s ease;
    }

    input[type="text"]:focus, textarea:focus {
        border-color: #e67e22;
    }

    input[type="submit"] {
        background-color: #16a085;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        font-size: 1.2rem;
        font-weight: bold;
    }

    input[type="submit"]:hover {
        background-color: #e67e22;
        transform: scale(1.05);
    }

    /* Animations */
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<section class="new_post">
    <center>
        <h1>Welcome {{user.username}}</h1>
        <h2>Let's Write a new post for the blog!!</h2>
    </center>
    <form method="POST" action="{% url 'new_post'%}">
        {% csrf_token %}
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" placeholder="Enter the title" required>

        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="15" cols="80" placeholder="Write your content here..." required></textarea>

        <input type="submit" value="Post">
    </form>
</section>
{% endblock %}
